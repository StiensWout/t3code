<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#0a0a0a";
        const CUSTOM_THEMES_STORAGE_KEY = "t3code:themes:v1";
        const THEME_FOLLOW_SYSTEM_STORAGE_KEY = "t3code:theme-follow-system";
        const THEME_APPEARANCE_MODE_STORAGE_KEY = "t3code:theme-appearance-mode";
        const SPLASH_COLORS = {
          light: {
            background: "#ffffff",
            foreground: "#262626",
            accent: "#4f46e5",
          },
          dark: {
            background: "#0a0a0a",
            foreground: "#f5f5f5",
            accent: "#818cf8",
          },
        };
        // These are the runtime defaults used to complete a custom palette
        // when a stored theme omits a role. Keep them separate from the
        // unselected splash so a partial custom theme does not flash generic
        // app colors before React mounts.
        const DEFAULT_THEME_PALETTES = {
          light: {
            background: "#faf5fa",
            foreground: "#501854",
            accent: "#a84370",
            chrome: "#f3e4f6",
          },
          dark: {
            background: "#180f1b",
            foreground: "#faeaf9",
            accent: "#df4c96",
            chrome: "#241329",
          },
        };
        // Keep this small boot-time copy in sync with the built-in palettes so
        // the selected theme is visible before the app has mounted.
        const BUILT_IN_THEME_PALETTES = {
          "t3-chat": {
            light: {
              background: "#faf5fa",
              foreground: "#501854",
              accent: "#a84370",
              chrome: "#f3e4f6",
            },
            dark: {
              background: "#211a23",
              foreground: "#fffaff",
              accent: "#df5398",
              chrome: "#291c28",
            },
          },
          "t3-grove": {
            light: {
              background: "#f3f7f4",
              foreground: "#241523",
              accent: "#1b7d50",
              chrome: "#eaf2ee",
            },
            dark: {
              background: "#1b2821",
              foreground: "#fffaff",
              accent: "#69d69a",
              chrome: "#1e2f26",
            },
          },
          "t3-ocean": {
            light: {
              background: "#f5f7f8",
              foreground: "#241523",
              accent: "#2672af",
              chrome: "#edf1f5",
            },
            dark: {
              background: "#17212b",
              foreground: "#fffaff",
              accent: "#70b9ee",
              chrome: "#1b2733",
            },
          },
          "t3-ember": {
            light: {
              background: "#f9f7f5",
              foreground: "#241523",
              accent: "#ae552a",
              chrome: "#f6f0ed",
            },
            dark: {
              background: "#291e1a",
              foreground: "#fffaff",
              accent: "#f09a64",
              chrome: "#31231c",
            },
          },
          "t3-iris": {
            light: {
              background: "#f8f7f9",
              foreground: "#241523",
              accent: "#7253b9",
              chrome: "#f2f0f7",
            },
            dark: {
              background: "#1d1929",
              foreground: "#fffaff",
              accent: "#9d7df2",
              chrome: "#221d31",
            },
          },
        };
        // Keep the built-in mode list in sync with the runtime so the selected
        // T3 Chat palette is visible before React has mounted.
        const BUILT_IN_THEME_MODES = Object.fromEntries(
          Object.entries(BUILT_IN_THEME_PALETTES).map(([id, palettes]) => [
            id,
            Object.keys(palettes),
          ]),
        );
        const RESERVED_THEME_IDS = [
          "system",
          "light",
          "dark",
          "t3-chat",
          "t3-grove",
          "t3-ocean",
          "t3-ember",
          "t3-iris",
          "t3-chat-dark",
        ];
        // Update every theme-color meta (including the media-scoped ones) so
        // the browser picks up the resolved color regardless of which element
        // its media query matches.
        const setThemeColor = (color) => {
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute("content", color);
          }
        };

        const isHexColor = (value) =>
          typeof value === "string" &&
          /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(value);
        const isRecord = (value) =>
          typeof value === "object" && value !== null && !Array.isArray(value);
        const isThemeId = (value) =>
          typeof value === "string" && /^[a-z0-9](?:[a-z0-9-]{0,47})$/.test(value);
        const isThemeLabel = (value) =>
          typeof value === "string" && value.trim().length > 0 && value.trim().length <= 48;
        const isThemePreferenceMode = (value) =>
          value === "light" || value === "dark" || value === "system";
        const isThemeAppearance = (value) => value === "light" || value === "dark";
        const splitThemePreference = (preference) => {
          const separatorIndex = preference.lastIndexOf(":");
          if (separatorIndex <= 0) {
            return { id: preference, mode: null, invalidMode: false };
          }
          const rawMode = preference.slice(separatorIndex + 1);
          return {
            id: preference.slice(0, separatorIndex),
            mode: isThemePreferenceMode(rawMode) ? rawMode : null,
            invalidMode: !isThemePreferenceMode(rawMode),
          };
        };
        const isStoredCustomTheme = (value) => {
          if (
            !isRecord(value) ||
            !isThemeId(value.id) ||
            RESERVED_THEME_IDS.includes(value.id) ||
            !isThemeLabel(value.label) ||
            !isThemeAppearance(value.appearance) ||
            !isRecord(value.colors)
          ) {
            return false;
          }
          if (value.variants === undefined) return true;
          if (!isRecord(value.variants)) return false;
          return Object.entries(value.variants).every(
            ([appearance, colors]) =>
              isThemeAppearance(appearance) &&
              (appearance === value.appearance || isRecord(colors)),
          );
        };
        const findCustomTheme = (themeId) => {
          if (RESERVED_THEME_IDS.includes(themeId)) return null;
          try {
            const parsed = JSON.parse(
              window.localStorage.getItem(CUSTOM_THEMES_STORAGE_KEY) ?? "null",
            );
            if (!Array.isArray(parsed)) return null;
            return (
              parsed.find((value) => isStoredCustomTheme(value) && value.id === themeId) ?? null
            );
          } catch {
            return null;
          }
        };

        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const rawPreference = splitThemePreference(storedTheme ?? "");
          // Older builds stored the dark T3 Chat palette as its own theme id;
          // keep that preference pointed at the dark variant.
          const isLegacyT3ChatDark =
            !rawPreference.invalidMode && rawPreference.id === "t3-chat-dark";
          const preference = isLegacyT3ChatDark
            ? {
                id: "t3-chat",
                mode: rawPreference.mode === "system" ? "system" : "dark",
                invalidMode: false,
              }
            : rawPreference;
          const explicitMode =
            preference.mode === "light" || preference.mode === "dark" ? preference.mode : null;
          const builtInModes = preference.invalidMode
            ? null
            : (BUILT_IN_THEME_MODES[preference.id] ?? null);
          const customTheme =
            preference.invalidMode || builtInModes ? null : findCustomTheme(preference.id);
          const themeModes =
            builtInModes ??
            (customTheme
              ? ["light", "dark"].filter(
                  (mode) => mode === customTheme.appearance || customTheme.variants?.[mode],
                )
              : null);
          // Mirrors the runtime's isKnownThemePreference: an explicit mode the
          // theme cannot render makes the whole preference unknown, and the
          // runtime falls back to the system default.
          const isKnownTheme =
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system" ||
            (themeModes !== null && (explicitMode === null || themeModes.includes(explicitMode)));
          const theme = isKnownTheme && storedTheme ? storedTheme : "system";
          const isThemed = isKnownTheme && themeModes !== null;
          const baseAppearance = customTheme ? customTheme.appearance : "light";
          const systemMode = prefersDark ? "dark" : "light";
          const storedAppearanceMode = window.localStorage.getItem(
            THEME_APPEARANCE_MODE_STORAGE_KEY,
          );
          const storedFollowSystem = window.localStorage.getItem(THEME_FOLLOW_SYSTEM_STORAGE_KEY);
          const appearanceMode = isThemePreferenceMode(storedAppearanceMode)
            ? storedAppearanceMode
            : storedFollowSystem === "true"
              ? "system"
              : storedFollowSystem === "false"
                ? (explicitMode ?? baseAppearance)
                : theme === "system" || preference.mode === "system"
                  ? "system"
                  : (explicitMode ?? baseAppearance);
          const themeMode = !isThemed
            ? null
            : appearanceMode === "system"
              ? themeModes.includes(systemMode)
                ? systemMode
                : baseAppearance
              : themeModes.includes(appearanceMode)
                ? appearanceMode
                : baseAppearance;
          const isDark = isThemed
            ? themeMode === "dark"
            : appearanceMode === "system"
              ? prefersDark
              : appearanceMode === "dark";
          const customColors =
            isThemed && customTheme
              ? themeMode === customTheme.appearance
                ? customTheme.colors
                : (customTheme.variants?.[themeMode] ?? customTheme.colors)
              : null;
          const customDefaults =
            customTheme && themeMode ? DEFAULT_THEME_PALETTES[themeMode] : null;
          // The runtime tolerates individual malformed colors, so fall back
          // per role rather than dropping the theme.
          const builtInSplash =
            isThemed && !customTheme && themeMode
              ? (BUILT_IN_THEME_PALETTES[preference.id]?.[themeMode] ?? null)
              : null;
          const fallbackSplash = isDark ? SPLASH_COLORS.dark : SPLASH_COLORS.light;
          const customSplash = customColors
            ? {
                background: isHexColor(customColors.canvas)
                  ? customColors.canvas
                  : (customDefaults?.background ?? fallbackSplash.background),
                foreground: isHexColor(customColors.text)
                  ? customColors.text
                  : (customDefaults?.foreground ?? fallbackSplash.foreground),
                accent: isHexColor(customColors.accent)
                  ? customColors.accent
                  : (customDefaults?.accent ?? fallbackSplash.accent),
              }
            : null;
          if (isThemed) {
            document.documentElement.dataset.themeId = customTheme ? customTheme.id : preference.id;
          } else {
            delete document.documentElement.dataset.themeId;
          }
          if (isKnownTheme && storedTheme !== null) {
            document.documentElement.dataset.themeSelected = "true";
          } else {
            delete document.documentElement.dataset.themeSelected;
          }
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = customColors
            ? isHexColor(customColors.chrome)
              ? customColors.chrome
              : (customDefaults?.chrome ?? fallbackSplash.background)
            : builtInSplash
              ? builtInSplash.chrome
              : isDark
                ? DARK_BACKGROUND
                : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          if (isKnownTheme && storedTheme !== null) {
            const splashColors = customSplash ?? builtInSplash ?? fallbackSplash;
            for (const [name, value] of Object.entries(splashColors)) {
              document.documentElement.style.setProperty(`--boot-${name}`, value);
            }
          }
          setThemeColor(chromeColor);
        } catch {
          // Mirror the runtime's storage-failure fallback: follow the OS.
          let prefersDark = true;
          try {
            prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            // Keep the dark default when even matchMedia is unavailable.
          }
          delete document.documentElement.dataset.themeId;
          delete document.documentElement.dataset.themeSelected;
          document.documentElement.classList.toggle("dark", prefersDark);
          const fallbackColor = prefersDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = fallbackColor;
          setThemeColor(fallbackColor);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      html[data-theme-selected="true"] #boot-shell {
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      html[data-theme-selected="true"] #boot-shell::before {
        position: absolute;
        inset: -20%;
        content: "";
        background: radial-gradient(
          circle at 50% 38%,
          color-mix(in srgb, var(--boot-accent) 18%, transparent),
          transparent 42%
        );
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
